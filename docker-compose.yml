services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    volumes:
      - backend_chroma_data:/ccai/multi_llm_chatbot_backend/chromadb_storage
    ports:
      - "8000:8000"
    networks:
      - application
    depends_on:
      - database
    environment:
      MONGODB_CONNECTION_STRING: "mongodb://database:27017"
      MONGODB_DATABASE: phd_advisor
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-CHANGEME-by-overriding-in-dot-env-file}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-?}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      GEMINI_MODEL: gemini-3-flash-preview
      CONFIG_PATH: ${CONFIG_PATH:-/ccai/phd_config.yaml}
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    volumes:
      # Use the local React application during development so source edits are
      # visible to the development server without rebuilding the image.
      - ./phd-advisor-frontend:/ccai/phd-advisor-frontend
      # Keep Linux-installed dependencies inside Docker. This prevents a host
      # node_modules directory (especially one from macOS) from being mounted.
      - frontend_node_modules:/ccai/phd-advisor-frontend/node_modules
    ports:
      - "3000:3000"
    networks:
      - application
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
      REACT_APP_TESTING_ONBOARDING: ${REACT_APP_TESTING_ONBOARDING:-false}
      # Filesystem events from macOS bind mounts can be missed in containers.
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
  database:
    image: mongo:8.0
    volumes:
      - mongo_data:/data/db
    networks:
      - application
volumes:
  mongo_data:
  backend_chroma_data:
  frontend_node_modules:
networks:
  application:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "0.0.0.0"
