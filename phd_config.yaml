# ── Personas ───────────────────────────────────────────────────────────────

personas:
  # The base prompt is appended to every persona's own prompt.
  # Put shared formatting rules here so each persona only defines its personality.
  base_prompt: |
    **Shared response principles:**
    - Use GitHub-Flavored Markdown.
    - Follow the advisor skill structure supplied for the current user request.
    - Preserve your persona's perspective while honoring the selected skill.
    - Use `###` for headings and `-` for bullets unless the user asks for another format.
    - Be concrete about what the student should do, notice, revise, or decide next.
    - End every substantive answer with exactly these two short sections:
      `### Important assumptions` and `### Information to verify`.
    - Put `- None identified` under a section when there is nothing meaningful to list.

  # Individual persona files are loaded from this directory (relative to this file).
  personas_dir: "personas/phd_advisors"

  # Optional whitelist of advisor IDs. When set, only these advisors are
  # available. Omit or leave unset to allow all enabled personas.
  allowed_advisors:
    - "standard"
    - "methods_evidence"
    - "theory_framing"
    - "critical_reviewer"
    - "application_stakeholders"
    - "critic"
    - "empathetic"
    - "methodologist"
    - "minimalist"
    - "motivator"
    - "pragmatist"
    - "socratic"
    - "storyteller"
    - "theorist"
    - "visionary"
    - "bf_nucleotidingsllm_NucleotidingsAI"
    - "bf_logisticsllm_Logistics_Expert_LLM"
    - "bf_logisticsllm_Agile_Project_Management_Instructor"
    - "bf_security_CybersecurityExpert"
    - "bf_shakespeare_Historian"
    - "bf_shakespeare_Shakespeare"

# ── Orchestrator / Clarification ───────────────────────────────────────────

orchestrator:
  # Minimum word count (with no specific keywords) before clarification triggers
  min_words_without_keywords: 6

  # Domain-specific keywords that indicate the user's message is on-topic enough
  specific_keywords:
    - "methodology"
    - "theory"
    - "data"
    - "analysis"
    - "research"
    - "thesis"
    - "dissertation"

  clarification_questions:
    - "What specific aspect of your research would you like guidance on?"
    - "Are you looking for help with methodology, theory, writing, or something else?"
    - "What stage of your program are you currently in?"
    - "What's the main challenge you're facing right now?"

  clarification_suggestions:
    - "Ask about research methodology or design"
    - "Get help with theoretical frameworks"
    - "Request guidance on practical next steps"
    - "Upload a document for specific feedback"

# ── Backend Settings (private — never sent to frontend) ────────────────────

auth:
  algorithm: "HS256"
  token_expiry_minutes: 43200   # 30 days

mongodb:
  database_name: "phd_advisor"

llm:
  gemini:
    model: "gemini-3-flash-preview"
  ollama:
    model: "llama3.2:1b"
  vllm:
    api_url: https://rtx6000blackwell-1.neonaiservices2.com/vllm0

rag:
  embedding_model: "all-MiniLM-L6-v2"
  chroma_collection: "phd_advisor_documents"
  chunk_size: 4000
  chunk_overlap: 400

# TODO: For development/testing only. PhD Advisor will likely not use these tools.
tools:
  search_courses:
    enabled: true
    max_results: 20   # Limit the number of results returned by the search_courses tool
  rate_my_professor:
    enabled: true
    # Run `python3 scripts/rmp_school_lookup.py "<school name>"` to find this value
    school_id: "U2Nob29sLTEwODc="   # CU Boulder school ID
