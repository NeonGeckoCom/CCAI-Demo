  <script>
    /* Backend origin for auth + chat.
     *
     * The API is NOT on the same host as this static frontend, so it has to be
     * named explicitly — and it differs by environment:
     *
     *   localhost / 127.0.0.1  -> "" so coach-api.js falls back to <host>:8000,
     *                             i.e. the backend you run locally (uvicorn).
     *   anywhere else (Vercel) -> the deployed Render API.
     *
     * localStorage['phd-api-base'] still overrides both, which is handy for
     * pointing a deployed UI at a tunnel during a demo.
     */
    (function () {
      var h = location.hostname;
      var isLocal = h === "localhost" || h === "127.0.0.1" || h === "";
      var RENDER_API = "https://phd-navigator-api.onrender.com";
      window.PHD_API_BASE = isLocal ? "" : RENDER_API;
      if (isLocal) {
        // No backend on :8000? Fall back to the deployed API so every AI
        // feature still works when someone runs the static frontend alone.
        // (Any HTTP response — even 401 — means the local backend is up;
        // only a network error rejects.)
        try {
          var probe = (location.protocol === "https:" ? "https:" : "http:") + "//" + (h || "localhost") + ":8000/";
          fetch(probe, { method: "GET" }).catch(function () { window.PHD_API_BASE = RENDER_API; });
        } catch (e) { window.PHD_API_BASE = RENDER_API; }
      }
    })();
  </script>

  <!-- TipTap — rich text editing for Documents (ESM; attaches window.TipTap
       when loaded. Editor components fall back to a plain textarea until then). -->
  <script type="module">
    try {
      const [{ Editor }, { default: StarterKit }] = await Promise.all([

      ]);
      window.TipTap = { Editor, StarterKit };
      window.dispatchEvent(new Event("tiptap-ready"));
    } catch (e) { console.warn("TipTap failed to load; falling back to plain editor.", e); }
  </script>
