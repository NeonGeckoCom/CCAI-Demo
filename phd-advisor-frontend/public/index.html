<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PhD Navigator — know the path ahead</title>
  <script>
    /* Backend origin for auth + chat. On Vercel the backend is NOT on the same
       host, so set this to your deployed API origin (e.g. "https://api.example.com")
       to enable real auth/chat. Leave "" to use the local dev default
       (http://<host>:8000); if unreachable the app runs in offline demo mode. */
    window.PHD_API_BASE = "";
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="coach-styles.css?v=rendered-pptx-slides-20260713" />
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail" data-bg-color="#D9774B">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#D9774B" />
      <circle cx="600" cy="380" r="190" fill="none" stroke="#FBEEE4" stroke-width="22" />

  <!-- lucide icons -->
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>

  <!-- mammoth: existing workspace docx preview support, not milestone discovery -->
  <script src="https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js"></script>

  <!-- pdf.js: client-side PDF text extraction, so uploaded slides/drafts stay
       readable even when the backend parser is unreachable. Defines window.pdfjsLib. -->
  <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js" integrity="sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e" crossorigin="anonymous"></script>
  <script>

      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
    }
  </script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Data (advisors, suggestions, stages, user) + the roadmap engine (the brain) -->
  <script src="canvas-data.js?v=academic-options-20260624"></script>
  <script src="roadmap-engine.js?v=direct-handbook-network-20260713"></script>

  <!-- Real backend wiring (auth, streaming chat, sessions). Defines window.CoachAPI. -->
  <script src="coach-api.js?v=deck-file-recording-gemini-20260713"></script>

  <!-- Shared Icon helper (must run before the tools module) -->
  <script type="text/babel" src="coach-shared.jsx?v=academic-combo-20260624" data-presets="react"></script>

  <script type="text/babel" src="coach-app.jsx?v=handbook-gate-migration-20260713b" data-presets="react"></script>

  <!-- Marketing landing + login (website-style home) -->
  <script type="text/babel" src="coach-landing.jsx?v=academic-combo-20260624" data-presets="react"></script>

  <!-- Insights / Workspace / Documents (warm redesign — uses coachHelpers) -->

  <!-- Chat v3 — personas + skills in composer, single/multiple toggle, skill actions -->
  <script type="text/babel" src="coach-chat.jsx?v=profile-context-20260708" data-presets="react"></script>

  <!-- Skills library (Chen's specialized-LLM skills) -->
  <script type="text/babel" src="coach-skills.jsx" data-presets="react"></script>

  <!-- Defense Room — mock defense / poster / talk practice (replaces Workspace page) -->
  <script type="text/babel" src="coach-defense.jsx?v=deck-file-recording-gemini-20260713" data-presets="react"></script>

  <!-- Welcome tutorial — guided walkthrough -->
  <script type="text/babel" src="coach-tour.jsx" data-presets="react"></script>

  <!-- Per-page first-view walkthroughs (Documents / Insights / Skills / Defense) -->
  <script type="text/babel" src="coach-page-tours.jsx" data-presets="react"></script>

  <!-- App: plan/step, recovery, chat, settings, router + mount -->
  <script type="text/babel" src="coach-app2.jsx?v=handbook-gate-migration-20260713b" data-presets="react"></script>
</body>
</html>
